<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>给你的信</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #fff0f8 0%, #f3e8ff 50%, #ffd6e8 100%);
      font-family: 'Noto Serif SC', serif;
      overflow: hidden;
      position: relative;
    }

    /* 背景飘浮爱心 */
    .bg-hearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bg-hearts span {
      position: absolute;
      color: rgba(232, 149, 168, 0.18);
      animation: floatHeart 6s ease-in-out infinite;
    }
    @keyframes floatHeart {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
      50% { transform: translateY(-22px) rotate(8deg); opacity: 1; }
    }

    /* 右上角音乐暂停键 / 左上角返回键 */
    .music-btn, .back-btn {
      position: fixed;
      top: 14px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(232, 149, 168, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: transform 0.2s ease;
    }
    .music-btn { right: 14px; }
    .back-btn { left: 14px; }
    .music-btn:hover, .back-btn:hover { transform: scale(1.08); }
    .music-btn svg, .back-btn svg { width: 20px; height: 20px; fill: #e895a8; }

    /* 信封 */
    .envelope {
      position: relative;
      width: min(340px, 88vw);
      height: 220px;
      z-index: 2;
      perspective: 1200px;
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #fff 0%, #fff5fa 100%);
      border-radius: 10px;
      box-shadow: 0 16px 40px rgba(232, 149, 168, 0.22);
    }

    .letter-paper {
      position: absolute;
      left: 6%;
      top: 6%;
      width: 88%;
      height: 88%;
      max-height: 88%;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      opacity: 0;
      z-index: 3;
      padding: 24px 20px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .letter-paper::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(255, 214, 232, 0.18) 0%, transparent 40%),
                  radial-gradient(circle at 80% 80%, rgba(233, 213, 255, 0.15) 0%, transparent 40%);
      pointer-events: none;
    }

    .letter-content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #5a4a5c;
      font-size: 1rem;
      line-height: 1.85;
    }

    .letter-content p {
      margin-bottom: 1em;
      opacity: 0;
      transform: translateY(12px);
    }

    .letter-content p:last-child { margin-bottom: 0; }

    .envelope-front {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #fff 0%, #fff0f6 100%);
      border-radius: 10px;
      z-index: 4;
      pointer-events: none;
    }

    .envelope-front::before {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(135deg, #fff 0%, #ffe4f0 100%);
      clip-path: polygon(0 100%, 50% 35%, 100% 100%);
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }

    .envelope-flap {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(135deg, #fff 0%, #ffd6e8 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      z-index: 5;
      transition: transform 0.9s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.7s ease;
      pointer-events: none;
    }

    /* 阶段一：打开翻盖，信纸升起 */
    .envelope.open .envelope-flap {
      transform: rotateX(-180deg);
    }

    .envelope.open .letter-paper {
      animation: paperRise 1.1s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
      animation-delay: 0.45s;
    }

    @keyframes paperRise {
      0% { transform: translateY(0) scale(0.92); opacity: 0; }
      45% { opacity: 1; }
      100% { transform: translateY(-150px) scale(1); opacity: 1; }
    }

    /* 阶段二：信封壳收回（淡出下沉缩小），信纸放大居中展开 */
    .envelope.expanded .envelope-back,
    .envelope.expanded .envelope-front {
      transition: opacity 0.7s ease, transform 0.7s ease;
      opacity: 0;
      transform: translateY(70px) scale(0.82);
      pointer-events: none;
    }

    .envelope.expanded .envelope-flap {
      transform: rotateX(-180deg) translateY(70px) scale(0.82);
      opacity: 0;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .envelope.expanded .letter-paper {
      animation: paperExpand 0.9s cubic-bezier(0.34, 1.1, 0.64, 1) forwards;
      height: auto;
      padding: 28px 26px;
    }

    @keyframes paperExpand {
      0% {
        left: 6%; top: 6%;
        width: 88%;
        max-height: 88%;
        transform: translateY(-150px) scale(1);
        opacity: 1;
      }
      100% {
        left: 50%; top: 50%;
        width: min(560px, 94vw);
        max-height: 78vh;
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    .envelope.expanded .letter-content p {
      animation: fadeUp 0.7s ease-out forwards;
    }

    .envelope.expanded .letter-content p:nth-child(1) { animation-delay: 0.55s; }
    .envelope.expanded .letter-content p:nth-child(2) { animation-delay: 0.95s; }
    .envelope.expanded .letter-content p:nth-child(3) { animation-delay: 1.35s; }
    .envelope.expanded .letter-content p:nth-child(4) { animation-delay: 1.75s; }
    .envelope.expanded .letter-content p:nth-child(5) { animation-delay: 2.15s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 打开按钮 */
    .open-btn {
      position: absolute;
      left: 50%;
      bottom: -68px;
      transform: translateX(-50%);
      padding: 12px 34px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff7eb3, #e895a8);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(232, 149, 168, 0.35);
      transition: transform 0.2s ease, opacity 0.3s ease;
      z-index: 10;
    }

    .open-btn:hover { transform: translateX(-50%) scale(1.05); }
    .open-btn.hide { opacity: 0; pointer-events: none; }

    @media (max-width: 640px) {
      .envelope { width: 88vw; height: 200px; }
      .letter-paper { padding: 18px 16px; }
      .letter-content { font-size: 0.92rem; line-height: 1.75; }
    }
  </style>
</head>
<body>
  <div class="bg-hearts" id="bg-hearts"></div>

  <button class="back-btn" id="back-btn" aria-label="返回上一页" title="返回">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </button>

  <button class="music-btn" id="music-btn" aria-label="音乐开关"></button>

  <div class="envelope" id="envelope">
    <div class="envelope-back"></div>
    <div class="letter-paper">
      <div class="letter-content">
        <p>哈喽呀，我最亲爱的宝宝，生日快乐呀！过了今天可就是大宝宝了哟，要好好爱护我这个弟弟哟！</p>
        <p>不知不觉间我们已经陪伴在彼此身边快半年了，这是我陪你过的第一个生日，好开心呀！</p>
        <p>跟你在一起的每一天我都很开心！</p>
        <p>新的一岁，我希望我的宝宝平平安安快快乐乐的，能够好好吃饭好好睡觉，无忧无虑的。</p>
        <p class="last-para">我会紧紧拉着你的手陪着你一步一步的走下去的，<br>未来的你过的每一个生日，我都不会缺席，生日快乐宝宝！我爱你！</p>
      </div>
    </div>
    <div class="envelope-front"></div>
    <div class="envelope-flap"></div>
    <button class="open-btn" id="open-btn">打开</button>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const openBtn = document.getElementById('open-btn');
    const bgHearts = document.getElementById('bg-hearts');

    // 随机生成背景爱心
    const heartChars = ['❤', '💕', '💖', '💗', '💓'];
    for (let i = 0; i < 14; i++) {
      const span = document.createElement('span');
      span.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
      span.style.left = Math.random() * 100 + 'vw';
      span.style.top = Math.random() * 100 + 'vh';
      span.style.fontSize = (14 + Math.random() * 18) + 'px';
      span.style.animationDelay = (Math.random() * 6) + 's';
      span.style.animationDuration = (5 + Math.random() * 4) + 's';
      bgHearts.appendChild(span);
    }

    // 信封打开：翻盖 → 信纸升起 → 信封收回 → 信纸放大展开
    function openEnvelope() {
      if (envelope.classList.contains('open')) return;
      openBtn.classList.add('hide');
      envelope.classList.add('open');
      setTimeout(() => envelope.classList.add('expanded'), 1500);
    }

    openBtn.addEventListener('click', openEnvelope);

    // 左上角返回键：回到上一个页面（合照页），无历史时回生日主页
    document.getElementById('back-btn').addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'birthday.html';
      }
    });

    // ================== 音乐：接着上一页的《特别的人》继续播放 ==================
    const musicBtn = document.getElementById('music-btn');
    // 与 birthday.html 保持一致的候选音源顺序
    const specialCandidates = [
      '方大同 - 特别的人.flac',
      '特别的人.flac',
      '方大同 - 特别的人.mp3',
      '特别的人.mp3',
      '方大同 - 特别的人.m4a'
    ];
    let specialIdx = 0;
    const specialAudio = new Audio();
    specialAudio.loop = true;
    specialAudio.preload = 'auto';
    specialAudio.src = encodeURI(specialCandidates[0]);
    let musicPlaying = false;

    // 当前音源无法加载/解码时，自动尝试下一个候选
    specialAudio.addEventListener('error', () => {
      specialIdx += 1;
      if (specialIdx < specialCandidates.length) {
        specialAudio.src = encodeURI(specialCandidates[specialIdx]);
        specialAudio.load();
        if (musicPlaying) {
          specialAudio.play().then(() => { musicPlaying = true; }).catch(() => {});
        }
      }
    });

    // 恢复上一页的播放进度
    const savedTime = parseFloat(sessionStorage.getItem('specialMusicTime') || '0');
    const wasPlaying = sessionStorage.getItem('specialMusicPlaying') !== '0';
    if (!isNaN(savedTime) && savedTime > 0) {
      specialAudio.currentTime = savedTime;
    }

    const playIcon = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
    const pauseIcon = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

    function startMusic() {
      specialAudio.play().then(() => { musicPlaying = true; }).catch(() => { musicPlaying = false; });
    }
    function stopMusic() {
      specialAudio.pause();
      musicPlaying = false;
    }
    musicBtn.addEventListener('click', () => { musicPlaying ? stopMusic() : startMusic(); });

    setInterval(() => {
      musicBtn.innerHTML = musicPlaying ? pauseIcon : playIcon;
    }, 200);

    // 自动接着播放；被浏览器阻止时，第一次点击页面再播
    if (wasPlaying) startMusic();
    function firstInteraction() {
      if (!musicPlaying) startMusic();
      document.removeEventListener('click', firstInteraction);
      document.removeEventListener('touchstart', firstInteraction);
    }
    document.addEventListener('click', firstInteraction);
    document.addEventListener('touchstart', firstInteraction, { passive: true });

    // 保存进度（返回上一页时也能续播）
    window.addEventListener('beforeunload', () => {
      sessionStorage.setItem('specialMusicTime', String(specialAudio.currentTime || 0));
      sessionStorage.setItem('specialMusicPlaying', musicPlaying ? '1' : '0');
    });

    // 手机端 3 秒后自动打开信封
    if (window.matchMedia('(max-width: 640px)').matches) {
      setTimeout(() => { if (!envelope.classList.contains('open')) openEnvelope(); }, 3000);
    }
  </script>
</body>
</html>
